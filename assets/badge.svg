<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="16" fill="#0d1117"/>
  <line x1="190" y1="0" x2="190" y2="50" stroke="#475569" stroke-width="4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 190 20;4 190 20;-4 190 20" dur="4s" repeatCount="indefinite"/>
    <rect x="80" y="50" width="220" height="290" rx="14" fill="#111827" stroke="url(#holo)" stroke-width="3"/>
    <rect x="165" y="60" width="50" height="8" rx="4" fill="#334155"/>
    <circle cx="190" cy="140" r="48" fill="#1e293b" stroke="url(#holo)" stroke-width="2"/>
    <text x="190" y="146" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">portrait</text>
    <text x="190" y="226" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">SHAIK AHAMED ALI</text>
    <text x="190" y="248" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12">DATA ANALYST</text>
    <text x="190" y="300" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">ID · ahamedali-analytics</text>
    <rect x="80" y="50" width="40" height="290" fill="#fff" opacity="0.08">
      <animate attributeName="x" values="80;260;80" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="monospace">
    <text x="380" y="70" fill="#f472b6" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">DASHBOARD</text>
    <g fill="#1e293b" stroke="#334155">
      <rect x="380" y="90" width="150" height="70" rx="8"/><rect x="545" y="90" width="150" height="70" rx="8"/><rect x="710" y="90" width="150" height="70" rx="8"/>
    </g>
    <g fill="#22d3ee" font-size="28" font-weight="700">
      <text x="395" y="132">8+</text><text x="560" y="132">8</text><text x="725" y="132">500+</text>
    </g>
    <g fill="#94a3b8" font-size="11">
      <text x="395" y="150">projects</text><text x="560" y="150">tools</text><text x="725" y="150">commits</text>
    </g>
    <text x="380" y="200" fill="#e2e8f0" font-size="13">Skills</text>
    <g fill="#22d3ee">
      <rect x="380" y="215" width="0" height="18" rx="4"><animate attributeName="width" from="0" to="400" dur="1.6s" fill="freeze"/></rect>
      <rect x="380" y="245" width="0" height="18" rx="4" fill="#a78bfa"><animate attributeName="width" from="0" to="340" dur="1.6s" begin="0.2s" fill="freeze"/></rect>
      <rect x="380" y="275" width="0" height="18" rx="4" fill="#f472b6"><animate attributeName="width" from="0" to="300" dur="1.6s" begin="0.4s" fill="freeze"/></rect>
    </g>
    <g fill="#0d1117" font-size="11"><text x="388" y="228">SQL</text><text x="388" y="258">Python</text><text x="388" y="288">Power BI</text></g>
    <circle cx="395" cy="325" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="408" y="329" fill="#94a3b8" font-size="12">NOW: learning something new</text>
  </g>
</svg>
