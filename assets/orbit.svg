<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="900" height="420" rx="16" fill="#0d1117"/>
  <text x="450" y="40" text-anchor="middle" fill="#f472b6" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">TECH ORBIT</text>
  <g transform="translate(450,225)">
    <circle r="150" fill="none" stroke="#1e293b" stroke-dasharray="4 6"/>
    <circle r="95" fill="none" stroke="#1e293b" stroke-dasharray="4 6"/>
    <circle r="34" fill="#22d3ee" opacity="0.15"><animate attributeName="r" values="30;40;30" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="22" fill="#22d3ee"/>
    <text y="5" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="13" font-weight="700">DATA</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <g transform="translate(150,0)"><circle r="26" fill="#1e293b" stroke="#3776ab" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">Python</text></g>
      <g transform="translate(-150,0)"><circle r="26" fill="#1e293b" stroke="#f2c811" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">PowerBI</text></g>
      <g transform="translate(0,-150)"><circle r="26" fill="#1e293b" stroke="#00758f" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">SQL</text></g>
      <g transform="translate(0,150)"><circle r="26" fill="#1e293b" stroke="#217346" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">Excel</text></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <g transform="translate(95,0)"><circle r="22" fill="#1e293b" stroke="#e97627" stroke-width="2"/><text y="4" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">Tableau</text></g>
      <g transform="translate(-95,0)"><circle r="22" fill="#1e293b" stroke="#f472b6" stroke-width="2"/><text y="4" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">Pandas</text></g>
    </g>
  </g>
</svg>
