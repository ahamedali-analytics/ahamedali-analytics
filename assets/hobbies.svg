<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <rect width="900" height="260" rx="16" fill="#0d1117"/>
  <text x="30" y="40" fill="#f472b6" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">HOBBIES</text>
  <g fill="#1e293b">
    <rect x="30" y="56" width="110" height="4" rx="2"/>
    <rect x="150" y="56" width="110" height="4" rx="2"/>
    <rect x="270" y="56" width="110" height="4" rx="2"/>
    <rect x="390" y="56" width="110" height="4" rx="2"/>
    <rect x="510" y="56" width="110" height="4" rx="2"/>
    <rect x="630" y="56" width="110" height="4" rx="2"/>
    <rect x="750" y="56" width="110" height="4" rx="2"/>
  </g>
  <g fill="#22d3ee">
    <rect x="30" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;110;110" keyTimes="0;0.1429;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="150" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.1429;0.2857;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="270" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.2857;0.4286;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="390" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.4286;0.5714;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="510" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.5714;0.7143;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="630" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.7143;0.8571;1" dur="21s" repeatCount="indefinite"/></rect>
    <rect x="750" y="56" width="0" height="4" rx="2"><animate attributeName="width" values="0;0;110" keyTimes="0;0.8571;1" dur="21s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g opacity="0"><text x="450" y="140" font-size="56">📊</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Building dashboards</text>
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.1429;1" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">🧩</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Solving SQL &amp; Python puzzles</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1429;0.2857" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">🤖</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Exploring AI tools</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2857;0.4286" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">🔍</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Finding patterns in open datasets</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4286;0.5714" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">🎧</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Listening to music</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5714;0.7143" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">✈️</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Travelling &amp; exploring new places</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.7143;0.8571" dur="21s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="450" y="140" font-size="56">🏏</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Playing &amp; watching cricket</text>
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.8571;1" dur="21s" repeatCount="indefinite"/></g>
