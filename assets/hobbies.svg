<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <rect width="900" height="260" rx="16" fill="#0d1117"/>
  <text x="30" y="40" fill="#f472b6" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">HOBBIES</text>
  <g>
    <rect x="30" y="56" width="200" height="4" rx="2" fill="#1e293b"/><rect x="240" y="56" width="200" height="4" rx="2" fill="#1e293b"/><rect x="450" y="56" width="200" height="4" rx="2" fill="#1e293b"/><rect x="660" y="56" width="200" height="4" rx="2" fill="#1e293b"/>
    <rect x="30" y="56" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;200;200;200;0" keyTimes="0;0.25;0.5;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="240" y="56" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.25;0.5;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="450" y="56" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;0;0;200;0" keyTimes="0;0.5;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><text x="450" y="140" font-size="56">🚴</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Cycling</text>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.24;0.26;0.74;0.76;0.99;1" dur="12s" repeatCount="indefinite"/></g>
    <g><text x="450" y="140" font-size="56">📊</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Exploring datasets</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.49;0.51;1" dur="12s" repeatCount="indefinite"/></g>
    <g><text x="450" y="140" font-size="56">🎮</text><text x="450" y="200" fill="#e2e8f0" font-size="22">Gaming</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.74;0.76;1" dur="12s" repeatCount="indefinite"/></g>
  </g>
</svg>
